<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GiGiT</title>

    <style>
        body {
            background: linear-gradient(135deg, #fff7d6, #ffe0f0);
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            color: #ff1493;
            font-size: 60px;
            margin-bottom: 40px;
            text-shadow: 3px 3px #ff69b4;
        }

        /* Floating music notes */
        .note {
            position: absolute;
            font-size: 35px;
            color: #ff69b4;
            animation: float 6s infinite ease-in-out;
            opacity: 0.7;
        }

        @keyframes float {
            0% { transform: translateY(0); opacity: 0.7; }
            50% { transform: translateY(-40px); opacity: 1; }
            100% { transform: translateY(0); opacity: 0.7; }
        }

        .button-container {
            display: flex;
            gap: 20px;
        }

        /* Guitar pick style buttons */
        button {
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 50px 50px 40px 40px;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            transition: 0.2s;
            box-shadow: 0 4px #ff1493;
        }

        button:hover {
            background-color: #ff1493;
            transform: scale(1.08);
        }
    </style>
</head>
<body>

<!-- Floating music notes -->
<div class="note" style="top: 10%; left: 5%;">🎵</div>
<div class="note" style="top: 20%; right: 10%;">🎶</div>
<div class="note" style="top: 70%; left: 15%;">🎼</div>
<div class="note" style="top: 50%; right: 5%;">🎵</div>

<h1>GiGiT 🎤</h1>

<div class="button-container">
    <button onclick="window.location.href='/login'">Login</button>
    <button onclick="window.location.href='/register'">Create Account</button>
</div>

</body>
</html>
