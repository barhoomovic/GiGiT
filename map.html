<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nearby Musicians Map</title>

    <style>
        body {
            background: linear-gradient(135deg, #fff7d6, #ffe0f0);
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #ff1493;
            font-size: 45px;
            margin-bottom: 20px;
            text-shadow: 2px 2px #ff69b4;
        }

        #map {
            height: 500px;
            width: 90%;
            margin: auto;
            border-radius: 15px;
            border: 3px dashed #ff69b4;
            box-shadow: 0 0 15px rgba(0,0,0,0.15);
        }

        button {
            margin-top: 20px;
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px 50px 40px 40px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: 0.2s;
            box-shadow: 0 4px #ff1493;
        }

        button:hover {
            background-color: #ff1493;
            transform: scale(1.08);
        }
    </style>
</head>
<body>

<h1>📍 Musicians Near You 🎵</h1>

<div id="map"></div>

<button onclick="window.location.href='/find_gigs'">⬅ Back</button>

<script>
    function initMap() {
        const defaultCenter = { lat: -37.8136, lng: 144.9631 }; // Melbourne fallback

        const map = new google.maps.Map(document.getElementById("map"), {
            zoom: 12,
            center: defaultCenter,
        });

        const users = {{ users|tojson }};

        // Try to get user's current location
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                position => {
                    const userPos = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };

                    // Add marker for YOU
                    new google.maps.Marker({
                        position: userPos,
                        map: map,
                        title: "You are here 🎸",
                        icon: {
                            path: google.maps.SymbolPath.CIRCLE,
                            scale: 8,
                            fillColor: "#ff1493",
                            fillOpacity: 0.9,
                            strokeWeight: 2,
                            strokeColor: "#fff"
                        }
                    });

                    map.setCenter(userPos);

                    // Filter nearby users (within 10 km)
                    const nearbyUsers = users.filter(u => {
                        if (!u.latitude || !u.longitude) return false;

                        const R = 6371; // Earth radius in km
                        const dLat = (u.latitude - userPos.lat) * Math.PI / 180;
                        const dLng = (u.longitude - userPos.lng) * Math.PI / 180;

                        const a =
                            Math.sin(dLat / 2) ** 2 +
                            Math.cos(userPos.lat * Math.PI / 180) *
                            Math.cos(u.latitude * Math.PI / 180) *
                            Math.sin(dLng / 2) ** 2;

                        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                        const distance = R * c;

                        return distance <= 10; // within 10 km
                    });

                    // Add markers for nearby users
                    nearbyUsers.forEach(u => {
                        new google.maps.Marker({
                            position: { lat: u.latitude, lng: u.longitude },
                            map: map,
                            title: `${u.name} 🎶`
                        });
                    });
                },
                () => {
                    alert("Location access denied — showing default area.");
                }
            );
        }
    }
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyABz9vMuqRJjRMvO0qpGOsuQF26eCDEV-Q&callback=initMap"
        async defer></script>

</body>
</html>
